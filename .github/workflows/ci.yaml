name: CI

env:
  # https://github.com/actions/virtual-environments/issues/1499
  MAVEN_CLI_OPTS: '-ntp --batch-mode --errors --fail-at-end --show-version -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
    -Dmaven.wagon.http.retryHandler.count=3 -Dstyle.color=always'
  TESTCONTAINERS_RYUK_DISABLED: 'true'
  CT_CHART_DIRS: 'contrib/charts/'
  CT_BUILD_ID: '${{ github.run_id }}'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - env:
            KEYCLOAK_VERSION: 21.1.2
            KEYCLOAK_CLIENT_VERSION: 21.1.2
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Setup java
      uses: actions/setup-java@v5.2.0
      with:
        distribution: 'temurin'
        java-version: 21

    - uses: actions/cache@v5.0.3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ matrix.env.KEYCLOAK_VERSION }}-${{ 
          hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-${{ matrix.env.KEYCLOAK_VERSION }}

    - name: Adapt sources for Keycloak versions < 26.4.0
      if: ${{ matrix.env.KEYCLOAK_VERSION < '26.4.0' }}
      run: |
        echo "COMPATIBILITY_PROFILE=-Ppre-keycloak26-4" >> $GITHUB_ENV

    - name: Adapt sources for Keycloak versions < 26.0.0
      if: ${{ matrix.env.KEYCLOAK_VERSION < '26.0.0' }}
      run: |
        echo "COMPATIBILITY_PROFILE=-Ppre-keycloak26" >> $GITHUB_ENV

    - name: Adapt sources for Keycloak versions < 23.0.0
      if: ${{ matrix.env.KEYCLOAK_VERSION < '23.0.0' }}
      run: |
        echo "COMPATIBILITY_PROFILE=-Ppre-keycloak23" >> $GITHUB_ENV

    - name: Adapt sources for Keycloak versions < 22.0.0 (jakarta -> javax)
      if: ${{ matrix.env.KEYCLOAK_VERSION < '22.0.0' }}
      run: |
        echo "COMPATIBILITY_PROFILE=-Ppre-keycloak22" >> $GITHUB_ENV
        echo "ADJUSTED_RESTEASY_VERSION=-Dresteasy.version=4.7.7.Final" >> $GITHUB_ENV

    - name: Build & Test
      run: ./mvnw ${MAVEN_CLI_OPTS} -Dkeycloak.version=${{ 
        matrix.env.KEYCLOAK_VERSION }} -Dkeycloak.client.version=${{ 
        matrix.env.KEYCLOAK_CLIENT_VERSION }} ${ADJUSTED_RESTEASY_VERSION} clean
        verify -Pcoverage ${COMPATIBILITY_PROFILE}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.0.0
      if: github.ref == 'refs/heads/main'
      with:
        files: "${{ github.workspace }}/target/site/jacoco/jacoco.xml"
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: ${{ !startsWith(github.event.ref, 'refs/tags/v') }}

    - name: Create Checksum
      run: |
        cp target/keycloak-config-cli.jar keycloak-config-cli-${{ matrix.env.KEYCLOAK_VERSION }}.jar
        sha256sum keycloak-config-cli-${{ matrix.env.KEYCLOAK_VERSION }}.jar > keycloak-config-cli-${{ matrix.env.KEYCLOAK_VERSION }}.jar.sha256

    - uses: actions/upload-artifact@v7.0.0
      with:
        name: keycloak-config-cli-${{ matrix.env.KEYCLOAK_VERSION }}-${{ 
          matrix.os }}-${{ matrix.arch }}
        if-no-files-found: error
        path: |
          keycloak-config-cli-${{ matrix.env.KEYCLOAK_VERSION }}.jar
          keycloak-config-cli-${{ matrix.env.KEYCLOAK_VERSION }}.jar.sha256

  # The container image is a Linux image (linux/amd64, linux/arm64 via QEMU); it can only be
  # built by a Linux Docker daemon, so it is built once per Keycloak version on a Linux host.
    name: build [${{ matrix.expander_leg }}]
